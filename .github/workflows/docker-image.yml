# Builds the image once and publishes it to GHCR, so the Railway template can
# deploy a prebuilt image instead of every user rebuilding it on their own plan.
name: Docker image

on:
  push:
    branches: [main, "ci/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Railway's Trial and Free plans reject images over 4 GB, so keep a margin.
      - name: Check image size
        run: |
          image="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          docker pull -q "$image"
          size=$(docker image inspect --format '{{.Size}}' "$image")
          echo "Unpacked image size: $((size / 1000000)) MB"
          if [ "$size" -gt 3800000000 ]; then
            echo "::error::Image is $((size / 1000000)) MB, over the 3800 MB budget (Railway Trial and Free plans cap images at 4 GB)"
            exit 1
          fi
